name: CMake Multi-Platform Build and Release

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux-appimage:
    name: Linux AppImage (Clang)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang ninja-build pkg-config \
          libboost-filesystem-dev libboost-locale-dev libboost-regex-dev \
          libspdlog-dev libfmt-dev libfuse3-dev libxcb-cursor0

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "6.7.2"
        host: linux
        target: desktop

    - name: Configure with LLVM
      shell: bash
      run: |
        cmake -S . -B build-linux -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Build
      run: cmake --build build-linux --parallel

    - name: Create AppImage
      shell: bash
      run: |
        set -euxo pipefail
        DESTDIR="$PWD/AppDir" cmake --install build-linux --prefix /usr --strip
        install -Dm644 packaging/linux/com.motioncam.fuse.desktop \
          AppDir/usr/share/applications/com.motioncam.fuse.desktop
        install -Dm644 assets/app_icon_linux.png \
          AppDir/usr/share/icons/hicolor/256x256/apps/motioncam-fuse.png
        curl -L --retry 3 -o linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        curl -L --retry 3 -o linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
        export LINUXDEPLOY_PLUGIN_QT_PATH="$PWD/linuxdeploy-plugin-qt.AppImage"
        export VERSION="${GITHUB_REF_NAME#v}"
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir \
          --desktop-file packaging/linux/com.motioncam.fuse.desktop \
          --icon-file assets/app_icon_linux.png \
          --plugin qt \
          --output appimage
        mkdir -p artifacts
        mv MotionCam_Fuse-*.AppImage artifacts/motioncam-${GITHUB_REF_NAME}-linux-x86_64.AppImage

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-Linux-AppImage
        path: artifacts/*.AppImage

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            build_type: Release
            build_dir: build-x86
            mac_arch: x86_64
            qt_arch: clang_64
            vcpkg_triplet: x64-osx
            artifact_suffix: macos-x86_64
            qt_version: 6.7.2
            qt_install: aqt
          - os: macos-14
            build_type: Release
            build_dir: build-arm64
            mac_arch: arm64
            qt_arch: clang_arm64
            vcpkg_triplet: arm64-osx
            artifact_suffix: macos-arm64
            qt_version: 6.7.2
            qt_install: brew

    steps:
    # ---------- CHECKOUT ----------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- CACHE ----------
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ~/Library/Caches/Homebrew
          ${{ matrix.build_dir }}
        key: ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-${{ hashFiles('CMakeLists.txt', '.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-

    # ---------- QT ----------
    - name: Install Qt (macOS via aqt)
      if: matrix.qt_install == 'aqt'
      uses: jurplel/install-qt-action@v3
      with:
        version: "${{ matrix.qt_version }}"
        host: mac
        target: desktop
        arch: ${{ matrix.qt_arch }}
        set-env: true

    - name: Install Qt (macOS arm64 via Homebrew)
      if: matrix.qt_install == 'brew'
      shell: bash
      run: |
        set -euxo pipefail
        brew install qt@6
        echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

    # ---------- VCPKG ----------
    - name: Install spdlog via vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgArguments: spdlog
        vcpkgTriplet: ${{ matrix.vcpkg_triplet }}

    # ---------- MACOS DEPENDENCIES ----------
    - name: Install macFUSE (macOS)
      run: brew install --cask macfuse

    # ---------- CONFIGURE ----------
    - name: Clean build directory (macOS)
      shell: bash
      run: |
        rm -rf "${{ matrix.build_dir }}"

    - name: Configure CMake (macOS)
      shell: bash
      run: |
        export VCPKG_BINARY_SOURCES=clear
        BREW_PREFIX="$(brew --prefix)"
        FUSE_LIB=""
        for candidate in "$BREW_PREFIX/lib/libfuse.2.dylib" "/usr/local/lib/libfuse.2.dylib" "/opt/homebrew/lib/libfuse.2.dylib"; do
          if [ -f "$candidate" ]; then
            FUSE_LIB="$candidate"
            break
          fi
        done
        if [ -z "$FUSE_LIB" ]; then
          echo "macFUSE libfuse.2.dylib not found"
          exit 1
        fi
        QT_PREFIX="${Qt6_ROOT_DIR:-${Qt6_DIR:-}}"
        if [ -z "$QT_PREFIX" ] || [ ! -d "$QT_PREFIX" ]; then
          if [ -d "${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos" ]; then
            QT_PREFIX="${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos"
          else
            QT_PREFIX="$(brew --prefix qt@6)"
          fi
        fi
        cmake -S . -B "${{ matrix.build_dir }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.mac_arch }} \
          -DCMAKE_PREFIX_PATH="${QT_PREFIX};$BREW_PREFIX" \
          -DCMAKE_CXX_FLAGS="-I$BREW_PREFIX/include" \
          -DCMAKE_LIBRARY_PATH="$BREW_PREFIX/lib" \
          -DFUSE_T_FRAMEWORK="$FUSE_LIB"

    # ---------- BUILD ----------
    - name: Build
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --parallel

    # ---------- PACKAGE ----------
    - name: Package binaries (macOS)
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        app=$(find "${{ matrix.build_dir }}" -name "*.app" | head -n 1)
        if [ -n "$app" ]; then
          echo "Packaging $app"
          bash scripts/package_macos_app.sh "$app"
          zip -r artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip "$app"
        fi

    # ---------- UPLOAD ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-${{ matrix.artifact_suffix }}
        path: artifacts/*

  build-windows:
    runs-on: ${{ matrix.os }}
    needs: build-macos
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_type: Release
            build_dir: build
            vcpkg_triplet: x64-windows
            artifact_suffix: windows
            qt_version: 6.7.2
            qt_arch: win64_msvc2019_64

    steps:
    # ---------- CHECKOUT ----------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- CACHE ----------
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          build/
        key: ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-${{ hashFiles('CMakeLists.txt', '.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-

    # ---------- QT ----------
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v3
      with:
        version: "${{ matrix.qt_version }}"
        host: windows
        target: desktop
        arch: ${{ matrix.qt_arch }}
        set-env: true

    # ---------- VCPKG ----------
    - name: Install spdlog via vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgArguments: spdlog
        vcpkgTriplet: ${{ matrix.vcpkg_triplet }}

    # ---------- CONFIGURE ----------
    - name: Configure CMake (Windows)
      shell: pwsh
      run: |
        cmake -S . -B ${{ matrix.build_dir }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_VERBOSE_MAKEFILE=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ matrix.qt_version }}/${{ matrix.qt_arch }}" `
          -Dprojected-fs="C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/um/x64/ProjectedFSLib.lib"

    # ---------- BUILD ----------
    - name: Build
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --parallel

    # ---------- PACKAGE ----------
    - name: Package binaries (Windows)
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        cd ${{ matrix.build_dir }}/${{ matrix.build_type }}
        exe=$(ls *.exe 2>/dev/null | head -n 1)
        if [ -n "$exe" ]; then
          echo "Running windeployqt on $exe"
          "${{ github.workspace }}/Qt/${{ matrix.qt_version }}/${{ matrix.qt_arch }}/bin/windeployqt.exe" "$exe" || echo "windeployqt failed"
          7z a ../../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip ./*
        fi

    # ---------- UPLOAD ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-${{ matrix.artifact_suffix }}
        path: artifacts/*

  # ---------- RELEASE ----------
  release:
    name: Create GitHub Release
    needs: [linux-appimage, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
